name: fetch
on:
  schedule:
    - cron: "6,21,36,51 * * * *"   # full fetch: news feeds, YouTube, Google Trends, your tips
    - cron: "2-57/5 * * * *"   # tips only: messages you send the bot become drafts within minutes
  workflow_dispatch:
    inputs:
      only_tips:
        description: "Only read my Telegram tips (used by an outside timer)"
        type: boolean
        default: false
concurrency: fetch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: fc-list | grep -qi liberation || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation)
      - run: python run_fetch.py
        env:
          ONLY_TIPS: ${{ (github.event.schedule == '2-57/5 * * * *' || inputs.only_tips == true) && '1' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_DELAY: ${{ vars.AI_DELAY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          MAX_AI_PER_RUN: ${{ vars.MAX_AI_PER_RUN }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          NOTIFY_MIN: ${{ vars.NOTIFY_MIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_TAG: ${{ vars.BRAND_TAG }}
          BRAND_BG: ${{ vars.BRAND_BG }}
          BRAND_ACCENT: ${{ vars.BRAND_ACCENT }}
      - name: Tell me if this run failed
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode text="⚠️ The fetch job failed. Open GitHub, Actions, fetch and read the red step."
